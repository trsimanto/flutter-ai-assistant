name: ai_assistant
description: AI Assistant - a Flutter chat app that streams answers from LLM providers (OpenAI-compatible and Gemini).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  equatable: ^2.0.5
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  flutter_markdown_plus: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
